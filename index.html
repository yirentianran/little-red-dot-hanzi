<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf2f8">
  <title>小红点识字</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到学习内容</a>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand-name">小红点识字</div>
      <p class="brand-edition">人教版四年级上册·2019年审定</p>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>请启用 JavaScript 以使用汉字笔顺追踪练习。</noscript>
  <script defer src="data/library-data.js"></script>
  <script defer src="js/data-store.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/svg-renderer.js"></script>
  <script defer src="js/animation-controller.js"></script>
  <script defer src="js/audio-controller.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      try {
        if (window.HanziApp && typeof window.HanziApp.bootstrapApp === 'function') {
          window.HanziApp.bootstrapApp(window);
        }
      } catch (error) {
        var status = document.getElementById('announcer');
        if (status) status.textContent = '应用启动失败，请重新打开页面。';
      }
    });
  </script>
</body>
</html>
