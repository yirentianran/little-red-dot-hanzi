<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小红点识字 - 横屏布局确认</title>
  <style>
    :root {
      --sky: #eaf2f8;
      --paper: #ffffff;
      --yellow: #fff2a8;
      --yellow-soft: #fff8d8;
      --ink: #20252b;
      --muted: #586675;
      --line: #c9d8e3;
      --grid: #a9bdca;
      --blue: #1769aa;
      --blue-dark: #0f4f83;
      --green: #2f7653;
      --red: #d92d20;
      --focus: #8b3d00;
      color: var(--ink);
      background: #dfe8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
    }

    button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .prototype-header {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      min-height: 68px;
      padding: 10px 16px;
      color: var(--ink);
      background: var(--paper);
      border-bottom: 1px solid #b8c8d2;
    }

    .prototype-title {
      display: grid;
      gap: 2px;
      min-width: 180px;
    }

    .prototype-title strong {
      font-size: 18px;
      line-height: 1.2;
    }

    .prototype-size {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .prototype-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 14px;
      min-width: 0;
    }

    .prototype-segmented {
      display: inline-grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(88px, auto);
      gap: 3px;
      padding: 3px;
      background: #eef3f6;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .prototype-segmented button {
      padding: 7px 12px;
      color: var(--muted);
      background: transparent;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
    }

    .prototype-segmented button[aria-pressed="true"] {
      color: var(--paper);
      background: var(--blue);
    }

    .preview-shell {
      display: grid;
      min-height: calc(100vh - 68px);
      min-height: calc(100dvh - 68px);
      padding: 14px;
    }

    .preview-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .preview-mount {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .device-preview {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      background: var(--sky);
      border: 1px solid #91a6b4;
      box-shadow: 0 8px 30px rgba(32, 37, 43, .18);
      transform-origin: top left;
    }

    .app-header {
      color: var(--ink);
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .app-header__inner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      height: 100%;
      margin: 0 auto;
    }

    .app-brand {
      font-weight: 800;
    }

    .app-edition {
      margin: 0;
      color: var(--muted);
    }

    .app-main {
      min-width: 0;
      min-height: 0;
      margin: 0 auto;
    }

    .screen {
      display: none;
      min-width: 0;
      min-height: 0;
    }

    .device-preview[data-page="directory"] .screen--directory,
    .device-preview[data-page="lesson"] .screen--lesson,
    .device-preview[data-page="learning"] .screen--learning,
    .device-preview[data-page="practice"] .screen--practice {
      display: block;
    }

    .page-title-row,
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .page-title,
    .learning-heading {
      margin: 0;
      font-weight: 800;
      line-height: 1.2;
    }

    .quiet-button,
    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      color: var(--blue-dark);
      background: transparent;
      border-radius: 6px;
      font-weight: 750;
    }

    .primary-button,
    .audio-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      color: var(--paper);
      background: var(--blue);
      border-radius: 6px;
      font-weight: 750;
    }

    .audio-button {
      background: var(--green);
    }

    .unit-grid {
      display: grid;
      min-width: 0;
    }

    .unit-band {
      min-width: 0;
      border-top: 2px solid var(--line);
    }

    .unit-heading {
      margin: 0;
      color: var(--blue-dark);
      font-weight: 800;
    }

    .lesson-list {
      display: grid;
      gap: 6px;
    }

    .lesson-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 7px 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: left;
    }

    .lesson-row__title {
      min-width: 0;
      overflow: hidden;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-counts {
      display: flex;
      gap: 4px;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .count-pill--recognize {
      color: var(--blue-dark);
      background: var(--sky);
    }

    .count-pill--write {
      color: #654c00;
      background: var(--yellow-soft);
    }

    .lesson-layout {
      display: grid;
      min-width: 0;
    }

    .lesson-summary {
      min-width: 0;
    }

    .eyebrow {
      margin: 0;
      color: var(--blue-dark);
      font-weight: 750;
    }

    .lesson-controls {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .group-switch,
    .speed-switch {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 3px;
      padding: 3px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .group-switch button,
    .speed-switch button {
      padding: 7px 9px;
      color: var(--muted);
      background: transparent;
      border-radius: 5px;
      font-weight: 750;
    }

    .group-switch button[aria-pressed="true"],
    .speed-switch button[aria-pressed="true"] {
      color: var(--paper);
      background: var(--blue);
    }

    .progress-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      color: #5f520e;
      background: var(--yellow-soft);
      border-block: 1px solid #e1c94e;
      font-size: 13px;
      font-weight: 700;
    }

    .start-button {
      width: 100%;
    }

    .character-grid {
      display: grid;
      min-width: 0;
    }

    .character-card {
      display: grid;
      grid-template-rows: auto 1fr auto;
      place-items: center;
      min-width: 0;
      padding: 6px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .character-card__pinyin,
    .character-card__status {
      color: var(--muted);
      font-size: 12px;
    }

    .character-card__hanzi {
      font-family: "Kaiti SC", STKaiti, KaiTi, serif;
      font-size: 42px;
      line-height: 1;
    }

    .character-card[data-active="true"] {
      border: 3px solid var(--blue);
    }

    .work-page {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
    }

    .position-label {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .work-surface {
      display: grid;
      min-width: 0;
      min-height: 0;
    }

    .hanzi-board {
      position: relative;
      justify-self: center;
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--paper);
      border: 3px solid var(--grid);
      border-radius: 5px;
    }

    .hanzi-board::before {
      position: absolute;
      content: "";
      inset: 0;
      background:
        linear-gradient(to right, transparent calc(50% - 1px), var(--grid) calc(50% - 1px), var(--grid) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to bottom, transparent calc(50% - 1px), var(--grid) calc(50% - 1px), var(--grid) calc(50% + 1px), transparent calc(50% + 1px));
      pointer-events: none;
    }

    .hanzi-board::after {
      position: absolute;
      content: "";
      inset: -21%;
      background:
        linear-gradient(45deg, transparent calc(50% - 1px), rgba(169, 189, 202, .8) calc(50% - 1px), rgba(169, 189, 202, .8) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(-45deg, transparent calc(50% - 1px), rgba(169, 189, 202, .8) calc(50% - 1px), rgba(169, 189, 202, .8) calc(50% + 1px), transparent calc(50% + 1px));
      pointer-events: none;
    }

    .board-glyph {
      position: absolute;
      z-index: 2;
      inset: 3%;
      display: grid;
      place-items: center;
      font-family: "Kaiti SC", STKaiti, KaiTi, serif;
      font-size: min(40vw, 62vh, 490px);
      line-height: 1;
    }

    .practice-glyph {
      color: #dfe8ee;
    }

    .tracking-dot {
      position: absolute;
      z-index: 3;
      top: 43%;
      left: 31%;
      width: 18px;
      height: 18px;
      background: var(--red);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(217, 45, 32, .15);
    }

    .tool-panel {
      min-width: 0;
      min-height: 0;
      background: var(--yellow);
      border: 2px solid #e1c94e;
      border-radius: 8px;
    }

    .learning-tools,
    .practice-tools {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .tool-pinyin {
      margin: 0;
      color: var(--blue-dark);
      font-size: 24px;
      font-weight: 800;
    }

    .tool-words,
    .tool-status,
    .animation-status,
    .practice-phase,
    .stroke-position,
    .practice-feedback {
      margin: 4px 0 0;
      font-weight: 700;
      line-height: 1.3;
    }

    .tool-words {
      color: var(--muted);
      font-size: 13px;
    }

    .tool-character {
      margin: 4px 0 0;
      font-family: "Kaiti SC", STKaiti, KaiTi, serif;
      font-size: 58px;
      line-height: 1;
    }

    .tool-status,
    .practice-phase,
    .stroke-position {
      color: #5f520e;
      font-size: 13px;
    }

    .tool-actions {
      display: grid;
      gap: 4px;
      margin-top: 6px;
    }

    .animation-status,
    .practice-feedback {
      min-height: 20px;
      color: #4d4518;
      font-size: 12px;
    }

    .stroke-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(44px, 1fr));
      gap: 5px;
      margin-top: 5px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--paper);
      border: 1px solid #b39f35;
      border-radius: 6px;
      font-size: 20px;
    }

    .speed-switch {
      margin-top: 5px;
    }

    .work-navigation {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .work-navigation .nav-button {
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .practice-progress {
      width: 100%;
      height: 10px;
      margin-top: 6px;
      accent-color: var(--green);
    }

    .practice-actions {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 6px;
      margin-top: 7px;
    }

    .device-preview[data-mode="phone"] .practice-progress {

    .device-preview[data-mode="phone"] .practice-actions {

    }

    .device-preview[data-mode="phone"] .work-navigation {

    .device-preview[data-mode="phone"] .work-navigation .nav-button {

    .device-preview[data-mode="phone"] .work-navigation .nav-button:first-child span:last-child,
    .device-preview[data-mode="phone"] .work-navigation .nav-button:last-child span:first-child {
      display: none;
    }

    .prototype-toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      max-width: min(360px, calc(100vw - 36px));

    .prototype-toast[data-visible="true"] {

      transform: translateY(0);

    @media (max-width: 980px) {

    @media (prefers-reduced-motion: reduce) {

  </style>
</head>
<body>

  <script>
    (function () {
      'use strict';

      var sizes = Object.freeze({
        desktop: Object.freeze({ width: 1440, height: 900, label: '电脑浏览器' }),
        tablet: Object.freeze({ width: 1000, height: 607, label: '平板横屏' }),
        phone: Object.freeze({ width: 844, height: 320, label: '手机横屏' })
      });
      var preview = document.querySelector('[data-slot="preview"]');
      var stage = document.querySelector('[data-slot="stage"]');
      var mount = document.querySelector('[data-slot="mount"]');
      var sizeLabel = document.querySelector('[data-slot="size-label"]');
      var toast = document.querySelector('[data-slot="toast"]');
      var toastTimer = null;

      function updatePressed(selector, value, attribute) {
        document.querySelectorAll(selector).forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.getAttribute(attribute) === value));
        });
      }

      function fitPreview() {
        var size = sizes[preview.dataset.mode];
        var scale = Math.min(
          stage.clientWidth / size.width,
          stage.clientHeight / size.height,
          1
        );
        if (!Number.isFinite(scale) || scale <= 0) scale = 1;
        preview.style.width = size.width + 'px';
        preview.style.height = size.height + 'px';
        preview.style.transform = 'scale(' + scale + ')';
        mount.style.width = Math.round(size.width * scale) + 'px';
        mount.style.height = Math.round(size.height * scale) + 'px';
        sizeLabel.textContent = size.label + ' · ' + size.width + ' × ' + size.height;
      }

      function selectMode(mode) {
        if (!Object.prototype.hasOwnProperty.call(sizes, mode)) return;
        preview.dataset.mode = mode;
        updatePressed('[data-mode]', mode, 'data-mode');
        fitPreview();
      }

      function selectPage(page) {
        if (['directory', 'lesson', 'learning', 'practice'].indexOf(page) === -1) return;
        preview.dataset.page = page;
        updatePressed('.prototype-segmented [data-page]', page, 'data-page');
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.visible = 'true';
        toastTimer = window.setTimeout(function () {
          toast.dataset.visible = 'false';
        }, 1600);
      }

      document.addEventListener('click', function (event) {
        var modeButton = event.target.closest('.prototype-segmented [data-mode]');
        if (modeButton) {
          selectMode(modeButton.dataset.mode);
          return;
        }

        var pageButton = event.target.closest('.prototype-segmented [data-page]');
        if (pageButton) {
          selectPage(pageButton.dataset.page);
          return;
        }

        var routeButton = event.target.closest('[data-go-page]');
        if (routeButton) {
          selectPage(routeButton.dataset.goPage);
          return;
        }

        var speedButton = event.target.closest('[data-speed]');
        if (speedButton) {
          document.querySelectorAll('[data-speed]').forEach(function (button) {
            button.setAttribute('aria-pressed', String(button === speedButton));
          });
          return;
        }

        var toggleButton = event.target.closest('[data-action="toggle-play"]');
        if (toggleButton) {
          var paused = toggleButton.textContent === 'Ⅱ';
          toggleButton.textContent = paused ? '▶' : 'Ⅱ';
          toggleButton.setAttribute('aria-label', paused ? '播放' : '暂停');
          document.querySelector('[data-slot="animation-status"]').textContent = paused
            ? '已暂停，第 1 / 11 笔'
            : '正在书写，第 1 / 11 笔，连续播放';
          return;
        }

        var feedbackButton = event.target.closest('[data-feedback]');
        if (feedbackButton) showToast(feedbackButton.dataset.feedback);
      });

      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(fitPreview).observe(stage);
      } else {
        window.addEventListener('resize', fitPreview);
      }
      fitPreview();
    }());
  </script>
