<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>练习完成页导航原型</title>
  <style>
    :root {
      --sky: #eaf2f8;
      --paper: #ffffff;
      --sunny-yellow: #fff2a8;
      --ink: #20252b;
      --muted-ink: #586675;
      --line: #c9d8e3;
      --grid-line: #aabfcd;
      --action-blue: #1769aa;
      --action-blue-dark: #0f4f83;
      --review-green: #2f7653;
      --yellow-line: #dfbd27;
      --radius: 8px;
      color: var(--ink);
      background: var(--sky);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
      overflow-x: clip;
      background: var(--sky);
    }

    button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid #8b3d00;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .site-header {
      height: 58px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 1200px);
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
    }

    .brand-edition {
      margin: 0;
      color: var(--muted-ink);
      font-size: 14px;
    }

    main {
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 18px 16px 24px;
    }

    .practice-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(360px, .88fr);
      gap: 20px;
      align-items: start;
    }

    .practice-board {
      position: relative;
      isolation: isolate;
      justify-self: center;
      width: min(100%, 620px, calc(100dvh - 118px));
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--paper);
      border: 3px solid var(--grid-line);
      border-radius: 5px;
    }

    .practice-board::before {
      position: absolute;
      z-index: 1;
      content: "";
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, transparent calc(50% - 1px), var(--grid-line) calc(50% - 1px), var(--grid-line) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to bottom, transparent calc(50% - 1px), var(--grid-line) calc(50% - 1px), var(--grid-line) calc(50% + 1px), transparent calc(50% + 1px));
    }

    .diagonal {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 142%;
      height: 3px;
      background: repeating-linear-gradient(
        to right,
        rgba(170, 191, 205, .78) 0 18px,
        transparent 18px 36px
      );
      transform-origin: center;
      pointer-events: none;
    }

    .diagonal--a {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .diagonal--b {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .board-character {
      position: absolute;
      z-index: 2;
      inset: 5%;
      display: grid;
      place-items: center;
      font-family: "Kaiti SC", STKaiti, KaiTi, serif;
      font-size: min(62vw, 60vh, 490px);
      line-height: 1;
    }

    .completion-mark {
      position: absolute;
      z-index: 3;
      right: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 12px;
      color: var(--paper);
      background: var(--review-green);
      border-radius: 6px;
      font-weight: 750;
    }

    .practice-side {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
      min-width: 0;
    }

    .practice-topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 44px;
    }

    .topbar-navigation {
      display: grid;
      grid-template-columns: auto repeat(2, 44px);
      align-items: center;
      gap: 4px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      justify-self: start;
      padding: 8px 10px;
      color: var(--action-blue-dark);
      background: transparent;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 800;
    }

    .practice-count {
      margin: 0;
      color: var(--muted-ink);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .topbar-arrow {
      width: 44px;
      height: 44px;
      padding: 0;
      color: var(--action-blue-dark);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 23px;
      font-weight: 800;
      line-height: 1;
    }

    .practice-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .completion-panel {
      display: flex;
      flex-direction: column;
      min-height: min(520px, calc(100dvh - 180px));
      padding: 24px;
      background: var(--sunny-yellow);
      border: 2px solid var(--yellow-line);
      border-radius: var(--radius);
    }

    .completion-heading {
      margin: 0;
      color: var(--action-blue-dark);
      font-size: 20px;
      line-height: 1.2;
      text-align: center;
    }

    .completion-summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      width: min(100%, 360px);
      margin: 20px auto 0;
    }

    .summary-character {
      font-family: "Kaiti SC", STKaiti, KaiTi, serif;
      font-size: 72px;
      line-height: 1;
    }

    .summary-copy {
      min-width: 0;
      text-align: left;
    }

    .summary-pinyin {
      display: block;
      color: var(--action-blue-dark);
      font-size: 27px;
      line-height: 1.15;
    }

    .summary-status {
      display: block;
      margin-top: 6px;
      color: var(--review-green);
      font-size: 17px;
      font-weight: 800;
    }

    .completion-actions {
      margin-top: 24px;
    }

    .return-button {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 800;
      line-height: 1.25;
    }

    .return-button {
      width: 100%;
      min-height: 52px;
      padding: 10px 14px;
      color: var(--paper);
      background: var(--action-blue);
      font-size: 17px;
    }

    .prototype-toast {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 16px;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      color: var(--paper);
      background: rgba(32, 37, 43, .94);
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
      transform: translate(-50%, 24px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .prototype-toast[data-visible="true"] {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (orientation: landscape) and (max-height: 760px) {
      main {
        padding-bottom: 2px;
      }
    }

    @media (orientation: landscape) and (max-height: 430px) {
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      .site-header {
        display: none;
      }

      main {
        height: 100dvh;
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
      }

      .practice-layout {
        grid-template-columns: minmax(0, 1fr) minmax(272px, 320px);
        gap: 10px;
        height: 100%;
      }

      .practice-board {
        align-self: center;
        width: min(100%, calc(100dvh - 16px));
      }

      .board-character {
        font-size: min(57vw, 72vh);
      }

      .completion-mark {
        right: 7px;
        bottom: 7px;
        min-height: 32px;
        padding: 5px 8px;
        font-size: 13px;
      }

      .practice-side {
        grid-template-rows: 44px minmax(0, 1fr);
        gap: 6px;
        height: 100%;
      }

      .practice-title {
        display: none;
      }

      .practice-count {
        font-size: 14px;
      }

      .topbar-navigation {
        gap: 3px;
      }

      .back-button {
        padding: 6px 4px;
        font-size: 16px;
      }

      .completion-panel {
        min-height: 0;
        height: 100%;
        padding: 10px;
      }

      .completion-heading {
        font-size: 17px;
      }

      .completion-summary {
        gap: 12px;
        width: auto;
        margin-top: 8px;
      }

      .summary-character {
        font-size: 52px;
      }

      .summary-pinyin {
        font-size: 22px;
      }

      .summary-status {
        margin-top: 3px;
        font-size: 14px;
      }

      .completion-actions {
        margin-top: 10px;
      }

      .return-button {
        min-height: 48px;
        padding: 6px 10px;
        font-size: 15px;
      }
    }

    @media (orientation: landscape) and (max-height: 430px) and (max-width: 650px) {
      .practice-layout {
        grid-template-columns: minmax(0, 1fr) minmax(248px, 290px);
      }

      .completion-heading {
        text-align: left;
      }

      .back-button {
        width: 44px;
        padding: 0;
        justify-content: center;
      }

      .back-button__text {
        display: none;
      }

      .summary-character {
        font-size: 46px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand-name">小红点识字</div>
      <p class="brand-edition">人教版四年级上册·2019年审定</p>
    </div>
  </header>

  <main>
    <section class="practice-layout" aria-labelledby="practice-title">
      <div class="practice-board" aria-label="据字练习已完成">
        <span class="diagonal diagonal--a" aria-hidden="true"></span>
        <span class="diagonal diagonal--b" aria-hidden="true"></span>
        <span class="board-character" aria-hidden="true">据</span>
        <span class="completion-mark">练习完成</span>
      </div>

      <div class="practice-side">
        <div class="practice-topbar">
          <button class="back-button" type="button" data-target="据" aria-label="返回据字学习">
            <span aria-hidden="true">←</span>
            <span class="back-button__text">学习“据”</span>
          </button>
          <div class="topbar-navigation" aria-label="当前字与相邻字导航">
            <p class="practice-count">第 2 个，共 15 个</p>
            <button class="topbar-arrow" type="button" data-target="潮" aria-label="学习前一个字：潮">←</button>
            <button class="topbar-arrow" type="button" data-target="堤" aria-label="学习后一个字：堤">→</button>
          </div>
        </div>

        <h1 class="practice-title" id="practice-title">练习“据”</h1>

        <section class="completion-panel" aria-labelledby="completion-heading">
          <h2 class="completion-heading" id="completion-heading">本字练习完成</h2>

          <div class="completion-summary">
            <span class="summary-character" aria-hidden="true">据</span>
            <p class="summary-copy">
              <strong class="summary-pinyin">jù</strong>
              <span class="summary-status">已掌握</span>
            </p>
          </div>

          <div class="completion-actions" role="group" aria-label="完成练习后的操作">
            <button class="return-button" type="button" data-target="据">返回“据”学习</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="prototype-toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var toast = document.querySelector('.prototype-toast');
      var timer;

      document.addEventListener('click', function (event) {
        var button = event.target.closest('[data-target]');
        if (!button) return;
        window.clearTimeout(timer);
        toast.textContent = '将进入“' + button.dataset.target + '”的学习页面';
        toast.dataset.visible = 'true';
        timer = window.setTimeout(function () {
          toast.dataset.visible = 'false';
        }, 1800);
      });
    }());
  </script>
</body>
</html>
