plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.littlereddot.hanzi'
  compileSdk 32

  defaultConfig {
    applicationId 'com.littlereddot.hanzi'
    minSdk 23
    targetSdk 32
    versionCode 7
    versionName '1.0.6'
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }

  kotlinOptions {
    jvmTarget = '11'
  }
}

def webProjectDir = rootProject.projectDir.parentFile
def generatedWebAssets = file("$buildDir/generated/webAssets")

tasks.register('syncWebAssets', Sync) {
  from(webProjectDir) {
    include 'index.html'
    include 'styles.css'
    include 'js/**'
    include 'data/library-data.js'
    include 'vendor/**'
    include 'assets/audio/**'
  }
  into new File(generatedWebAssets, 'web')
}

android.sourceSets.main.assets.srcDir generatedWebAssets

tasks.named('preBuild').configure {
  dependsOn tasks.named('syncWebAssets')
}

dependencies {
  implementation 'androidx.webkit:webkit:1.5.0'
}
